        <label>Descrição (opcional):</label><br>
        <textarea id="descricaoSala"></textarea><br><br>

        <label>Máx. de jogadores:</label><br>
        <input id="maxJogadores" type="number" min="2" max="15"><br><br>

        <label>Senha da sala (opcional):</label><br>
        <input id="senhaSala" type="text"><br><br>

        <h3>Salvar os dados da sala?</h3>
        <input type="checkbox" id="salvarSala">
        <button onclick="criarSala()">Criar Sala</button>
    </div>

<script src="js/div_alerta.js"></script>
<script src="js/header.js"></script>
<script>
    div_criarsala.style.display = "none"
    const socket = io();
    function preencher(){
        for(let c = 0; c<=dados.lenght; c++){

        }
    }

    function entrarNaSala() {
        const nome = sessionStorage.NICKNAME_USUARIO;
        const sala = document.getElementById('nomeSalaENTRAR').value;

        if (!sala) return alert('Preencha tudo');

        // Salvar os dados para a próxima página
        localStorage.setItem('nome', nome);
        localStorage.setItem('sala', sala);
        // Envia para o servidor a entrada na sala
        socket.emit('entrarNaSala', { sala, nome });

        // Redireciona para a sala correta
        window.location.href = `sala.html`; // ex: salaCastelo.html
    }

    function criarSala() {
        const dados = {
            nomeSala: document.getElementById('nomeSala').value,
            descricao: document.getElementById('descricaoSala').value,
            maxJogadores: parseInt(document.getElementById('maxJogadores').value),
            senha: document.getElementById('senhaSala').value,
            criador: sessionStorage.NICKNAME_USUARIO
        };
        console.log(dados);
        if (!dados.nomeSala || isNaN(dados.maxJogadores)) {
            return funcao_alerta("Preencha os campos obrigatórios.")
        }
        socket.emit('criarSala', dados);
        // Aguarda resposta do servidor
        socket.on('salaCriada', (sala) => {
            localStorage.setItem('nome', dados.criador);
            localStorage.setItem('sala', sala.nomeSala);
            window.location.href = `sala.html`;
        });
    }
</script>
